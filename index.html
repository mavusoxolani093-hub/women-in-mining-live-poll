<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <title>Women in Mining - Live Poll</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="participant-page">
  <header class="participant-hero">
    <div class="hero-image" aria-hidden="true"></div>
    <div class="hero-shade" aria-hidden="true"></div>
    <div class="hero-copy">
      <p class="brand-mark">Women in Mining</p>
      <p class="session-label">Live audience question</p>
    </div>
  </header>

  <main class="participant-main">
    <section class="question-shell" aria-live="polite">
      <div class="question-progress">
        <span id="question-number">Question</span>
        <span id="connection-state" class="connection-state">Connecting</span>
      </div>
      <div id="question-root"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
